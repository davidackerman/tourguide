name: Pages

# The site at https://davidackerman.github.io/tourguide/: the workspace web app
# (web-app/) built by Vite, as coresample's Pages workflow publishes its page.
# Pull requests build and check it; pushes to main also publish it to the
# gh-pages branch, which GitHub Pages serves.
#
# Only the page is hosted. The bridge and the MCP server run on the user's own
# machine, and the hosted page connects out to the bridge on localhost.
on:
  push:
    branches: [main]
    paths:
      - web-app/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - web-app/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write   # pushes the gh-pages branch

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      # `npm run build` type-checks first (tsc --noEmit && vite build), so a
      # type error stops the deploy.
      - name: Build the page
        working-directory: web-app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Fail here, not as a blank page on the site.
      - name: Check the site
        run: |
          for f in index.html catalog.json sw.js datasets/jrc_hela-2.yaml; do
            [ -f "web-app/dist/$f" ] || { echo "::error::web-app/dist/$f is missing"; exit 1; }
          done
          # The site lives under /tourguide/, so asset URLs must stay relative
          # (vite base "./"); a root-absolute /assets/ URL would 404 there.
          if grep -qE '(src|href)="/assets/' web-app/dist/index.html; then
            echo "::error::index.html has root-absolute /assets/ URLs; keep vite base './'"; exit 1
          fi
          touch web-app/dist/.nojekyll   # Jekyll would drop _-prefixed files
          du -sh web-app/dist

      - uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web-app/dist
          force_orphan: true
          full_commit_message: "Deploy ${{ github.sha }}: the Tourguide workspace page"
